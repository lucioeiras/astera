appId: ${APP_ID}
name: Inspect the profile activity calendar
---
- launchApp:
    clearState: true
- tapOn: 'Profile'
- scrollUntilVisible:
    element: 'Activity'
    direction: DOWN
- scrollUntilVisible:
    element: 'Previous activity month'
    direction: DOWN
- assertVisible: 'Best activity streak in .*'
- tapOn: 'Previous activity month'
- tapOn: 'Next activity month'
- scrollUntilVisible:
    element: 'No activity logs recorded for .*'
    direction: DOWN
- assertVisible: 'No activity logs recorded for .*'
- scrollUntilVisible:
    element: 'Games'
    direction: UP
- tapOn: 'Games'
- assertVisible: 'Best activity streak in .*'
- tapOn: 'Books'
- assertVisible: 'Best activity streak in .*'
- tapOn: 'All'
