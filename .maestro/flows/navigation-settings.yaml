appId: ${APP_ID}
name: Navigate tabs and inspect settings
---
- launchApp:
    clearState: true
- assertVisible: 'Start your collection here'
- tapOn: 'Folders'
- assertVisible: 'Want to'
- tapOn: 'Profile'
- assertVisible: 'Saved cards'
- tapOn: 'Settings'
- assertVisible: 'Appearance'
- scrollUntilVisible:
    element: 'E2E Library'
    direction: DOWN
- assertVisible: 'Current space'
- scrollUntilVisible:
    element: 'AI Model for Texts'
    direction: DOWN
